# ---------------------------------------------------------------------------
# Nginx — proxy inverso para la API de AutoPart Pro
#
# Solo necesario si el backend corre en un VPS propio. En plataformas como
# Railway, Render o Fly.io el proxy y el certificado los pone la plataforma
# y este archivo no hace falta.
#
# Instalar en /etc/nginx/sites-available/ y enlazar en sites-enabled/.
# El certificado se obtiene con:
#   sudo certbot --nginx -d api.nunez.cloud
# ---------------------------------------------------------------------------

# Redirección de HTTP a HTTPS. Wompi no acepta http:// en producción.
server {
    listen 80;
    listen [::]:80;
    server_name api.nunez.cloud;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.nunez.cloud;

    ssl_certificate     /etc/letsencrypt/live/api.nunez.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nunez.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # No anunciar la versión de Nginx.
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Tope de tamaño: la API solo recibe JSON, nunca archivos.
    client_max_body_size 1m;

    location /api {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # Imágenes del catálogo, servidas por el backend.
    location /imagenes {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;

        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Nada más se expone desde este subdominio.
    location / {
        return 404;
    }
}
