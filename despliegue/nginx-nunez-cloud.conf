# ---------------------------------------------------------------------------
# Nginx — nunez.cloud sirviendo frontend + backend de AutoPart Pro juntos
#
# Arquitectura: todo en un solo VPS.
#   - El frontend compilado (React) se sirve como archivos estáticos.
#   - /api y /imagenes se reenvían al backend Node, que corre en
#     127.0.0.1:4000 vía systemd (ver despliegue/autopart-api.service).
#   - MariaDB corre en el mismo servidor, en localhost:3306.
#
# Instalar en /etc/nginx/sites-available/ y enlazar en sites-enabled/.
# Certificado:
#   sudo certbot --nginx -d nunez.cloud -d www.nunez.cloud
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name nunez.cloud www.nunez.cloud;
    return 301 https://nunez.cloud$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nunez.cloud www.nunez.cloud;

    ssl_certificate     /etc/letsencrypt/live/nunez.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nunez.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 1m;

    # Frontend compilado: npm run build en frontend/, sube la carpeta dist/.
    root /var/www/autopart/frontend/dist;
    index index.html;

    # React Router resuelve las rutas en el navegador: cualquier ruta
    # desconocida debe devolver index.html, no un 404 de Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash en el nombre (JS/CSS de Vite): cache agresivo.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API del backend.
    location /api {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # Imágenes de productos, servidas por el backend.
    location /imagenes {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
